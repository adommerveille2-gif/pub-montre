name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Image avec pgvector : requise dès la phase 2, utilisée dès maintenant pour éviter une dérive.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pubmontre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pubmontre_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pubmontre_test?schema=public
      AUTH_SECRET: ci-only-secret-0123456789abcdef
      AUTH_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm db:generate

      - name: Appliquer les migrations et le seed
        run: |
          pnpm db:migrate:deploy
          pnpm --filter @pub-montre/db exec prisma db seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires et base de données
        run: pnpm test

      - name: Build de production
        run: pnpm build
        env:
          EMAIL_DRIVER: console

      - name: Installer Chromium pour Playwright
        run: pnpm --filter @pub-montre/web exec playwright install --with-deps chromium

      - name: Tests end-to-end
        run: pnpm test:e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
